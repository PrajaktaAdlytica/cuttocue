name: Responsive layout QA
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/qa" playwright@1.56.1
      - run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/cuetocue-http.log 2>&1 &
          NODE_PATH="$RUNNER_TEMP/qa/node_modules" node qa/layout.cjs
